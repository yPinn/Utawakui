name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gitleaks secret scan
        uses: docker://ghcr.io/gitleaks/gitleaks:latest
        with:
          args: detect --source . --verbose --redact

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Commitlint push
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: npx --no -- commitlint --from "${{ github.event.before }}" --to "${{ github.sha }}" --verbose

      - name: Commitlint pull request
        if: github.event_name == 'pull_request'
        run: npx --no -- commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose

      - name: Dependency audit
        run: npm audit --audit-level=critical

      - name: License inventory
        run: npm run license:inventory

      - run: npm run lint

      - run: npm run format:check

      - run: npm run lint:md

      - run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore

      - run: npm run build

  windows-package:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build unsigned Windows updater bundle
        run: npm run dist

      - name: Verify ephemeral unsigned package
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath 'package.json' -Raw | ConvertFrom-Json).version
          ./scripts/verify-unsigned-windows-package.ps1 -Version $version
