name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks secret scan
        uses: docker://ghcr.io/gitleaks/gitleaks:latest
        with:
          args: detect --source . --verbose --redact

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Commitlint pull request
        if: github.event_name == 'pull_request'
        run: npx --no -- commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose

      - name: Commitlint push
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: npx --no -- commitlint --from "${{ github.event.before }}" --to "${{ github.sha }}" --verbose

      - run: npm audit --audit-level=critical

      - run: npm run lint

      - run: npm run format:check

      - run: npm run lint:md

      - run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore

      - run: npm run build
