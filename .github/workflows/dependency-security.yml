name: Dependency security

# Advisories are published against unchanged lockfiles, so ordinary CI alone
# never sees them. Every step runs so one finding does not hide the others.
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: App dependency audit
        run: npm run audit:all

      - name: Feedback relay dependency audit
        if: ${{ !cancelled() }}
        working-directory: services/feedback-relay
        run: npm audit --audit-level=high

      - name: Evaluation runtime dependency audit (report only)
        if: ${{ !cancelled() }}
        continue-on-error: true
        working-directory: scripts/lyrics-provider-netease-runtime
        run: npm audit --audit-level=high

      - name: Downloaded runtime component advisories (report only)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: npm run audit:runtime
