name: Public Test Build

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag to rebuild
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: public-test-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.release-version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Require tag commit on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main

      - name: Gitleaks secret scan
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f # v8.30.1
        with:
          args: detect --source . --verbose --redact

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Dependency audit
        run: npm audit --audit-level=critical

      - run: npm ci

      - name: Verify release version and notes
        id: release-version
        run: |
          version="$(npm run --silent release:verify-version -- \
            --tag "$RELEASE_TAG" \
            --notes "docs/releases/$RELEASE_TAG.md")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: License inventory
        run: npm run license:inventory

      - run: npm run commitlint
      - run: npm run lint
      - run: npm run format:check
      - run: npm run lint:md
      - run: npm run test:coverage
      - run: npm run build

      - name: Upload coverage report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: public-test-coverage-${{ env.RELEASE_TAG }}
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

  package:
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Recheck release contract
        shell: pwsh
        run: |
          $version = npm run --silent release:verify-version -- `
            --tag $env:RELEASE_TAG `
            --notes "docs/releases/$env:RELEASE_TAG.md"
          if ($version.Trim() -ne $env:RELEASE_VERSION) {
            throw 'Release version changed between validation and packaging'
          }

      - name: Build unsigned installer
        run: npm run dist

      - name: Verify unsigned updater bundle and create checksum
        shell: pwsh
        run: ./scripts/verify-unsigned-windows-package.ps1 -Version $env:RELEASE_VERSION -WriteChecksum

      - name: Upload unsigned test bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: utawakui-${{ env.RELEASE_VERSION }}-unsigned-test
          path: |
            release/Utawakui-Setup-${{ env.RELEASE_VERSION }}.exe
            release/Utawakui-Setup-${{ env.RELEASE_VERSION }}.exe.blockmap
            release/latest.yml
            release/SHA256SUMS.txt
            docs/releases/${{ env.RELEASE_TAG }}.md
          if-no-files-found: error
          retention-days: 7
