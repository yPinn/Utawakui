name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag to rebuild
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_REPOSITORY: yPinn/Utawakui-Releases
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release-version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Require tag commit on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main

      - name: Gitleaks secret scan
        uses: docker://ghcr.io/gitleaks/gitleaks:latest
        with:
          args: detect --source . --verbose --redact

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Verify release version and notes
        id: release-version
        run: |
          version="$(npm run --silent release:verify-version -- \
            --tag "$RELEASE_TAG" \
            --notes "docs/releases/$RELEASE_TAG.md")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Dependency audit
        run: npm audit --audit-level=critical

      - name: License inventory
        run: npm run license:inventory

      - run: npm run commitlint
      - run: npm run lint
      - run: npm run format:check
      - run: npm run lint:md
      - run: npm run test:coverage
      - run: npm run build

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-coverage-${{ env.RELEASE_TAG }}
          path: coverage/
          if-no-files-found: ignore

  package:
    needs: validate
    runs-on: windows-latest
    environment: release
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Require release credentials
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
        run: |
          $required = @{
            GH_TOKEN = $env:GH_TOKEN
          }
          foreach ($entry in $required.GetEnumerator()) {
            if ([string]::IsNullOrWhiteSpace($entry.Value)) {
              throw "Missing release credential or variable: $($entry.Key)"
            }
          }

      - name: Verify public release access
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
        run: |
          gh api "repos/$env:RELEASE_REPOSITORY" --silent
          if ($LASTEXITCODE -ne 0) {
            throw 'PUBLIC_RELEASE_TOKEN cannot access the release repository'
          }

      - run: npm ci

      - name: Recheck release contract
        shell: pwsh
        run: |
          $version = npm run --silent release:verify-version -- `
            --tag $env:RELEASE_TAG `
            --notes "docs/releases/$env:RELEASE_TAG.md"
          if ($version.Trim() -ne $env:RELEASE_VERSION) {
            throw 'Release version changed between validation and packaging'
          }

      - name: Build unsigned updater bundle
        run: npm run dist

      - name: Verify unsigned files and packaged version
        shell: pwsh
        run: |
          $installer = Join-Path $PWD "release/Utawakui-Setup-$env:RELEASE_VERSION.exe"
          $executable = Join-Path $PWD 'release/win-unpacked/electron.exe'
          foreach ($file in @($installer, $executable)) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Missing unsigned file: $file"
            }
            $signature = Get-AuthenticodeSignature -LiteralPath $file
            if ($signature.Status -ne 'NotSigned') {
              throw "Unexpected Authenticode status for ${file}: $($signature.Status)"
            }
          }

          $productVersion = (Get-Item -LiteralPath $executable).VersionInfo.ProductVersion
          $acceptedVersions = @($env:RELEASE_VERSION, "$env:RELEASE_VERSION.0")
          if ($productVersion -notin $acceptedVersions) {
            throw "Packaged version mismatch: $productVersion"
          }

      - name: Verify packaged notices
        shell: pwsh
        run: |
          $asarPath = 'release/win-unpacked/resources/app.asar'
          if (-not (Test-Path -LiteralPath $asarPath -PathType Leaf)) {
            throw 'Missing packaged app.asar'
          }
          $listing = node node_modules/@electron/asar/bin/asar.js list $asarPath
          if ($LASTEXITCODE -ne 0) { throw 'Unable to inspect packaged app.asar' }
          foreach ($requiredNotice in @('LICENSE.md', 'THIRD_PARTY_NOTICES.md')) {
            $escapedName = [regex]::Escape($requiredNotice)
            $notice = $listing | Where-Object { $_ -match "[/\\]$escapedName$" }
            if (-not $notice) { throw "$requiredNotice is not packaged" }
          }

      - name: Verify update artifacts
        run: npm run release:verify-artifacts -- --version ${{ env.RELEASE_VERSION }}

      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $name = "Utawakui-Setup-$env:RELEASE_VERSION.exe"
          $installer = Join-Path 'release' $name
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath 'release/SHA256SUMS.txt' -Value "$hash  $name" -Encoding utf8NoBOM

      - name: Upload unsigned updater bundle
        uses: actions/upload-artifact@v7
        with:
          name: utawakui-${{ env.RELEASE_VERSION }}-unsigned-updater
          path: |
            release/Utawakui-Setup-${{ env.RELEASE_VERSION }}.exe
            release/Utawakui-Setup-${{ env.RELEASE_VERSION }}.exe.blockmap
            release/latest.yml
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Create or update public draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
        run: |
          $installer = "release/Utawakui-Setup-$env:RELEASE_VERSION.exe"
          $blockmap = "$installer.blockmap"
          $metadata = 'release/latest.yml'
          $checksum = 'release/SHA256SUMS.txt'
          $notes = "docs/releases/$env:RELEASE_TAG.md"
          $title = "Utawakui $env:RELEASE_VERSION"

          $releaseJson = gh release view $env:RELEASE_TAG `
            --repo $env:RELEASE_REPOSITORY `
            --json isDraft,isPrerelease 2>$null

          if ($LASTEXITCODE -eq 0) {
            $release = $releaseJson | ConvertFrom-Json
            if (-not $release.isDraft) {
              throw 'Refusing to modify an already published release'
            }
            if ($release.isPrerelease) {
              throw 'Stable workflow cannot update a prerelease'
            }
            gh release edit $env:RELEASE_TAG `
              --repo $env:RELEASE_REPOSITORY `
              --draft `
              --title $title `
              --notes-file $notes
            if ($LASTEXITCODE -ne 0) { throw 'Failed to update draft release' }
            gh release upload $env:RELEASE_TAG `
              $installer $blockmap $metadata $checksum `
              --repo $env:RELEASE_REPOSITORY `
              --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Failed to upload release assets' }
          } else {
            gh release create $env:RELEASE_TAG `
              $installer $blockmap $metadata $checksum `
              --repo $env:RELEASE_REPOSITORY `
              --target main `
              --draft `
              --title $title `
              --notes-file $notes
            if ($LASTEXITCODE -ne 0) { throw 'Failed to create draft release' }
          }
