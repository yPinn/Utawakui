name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag to rebuild
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_REPOSITORY: yPinn/Utawakui-Releases
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release-version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Require tag commit on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main

      - name: Gitleaks secret scan
        uses: docker://ghcr.io/gitleaks/gitleaks:latest
        with:
          args: detect --source . --verbose --redact

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Verify release version and notes
        id: release-version
        run: |
          version="$(npm run --silent release:verify-version -- \
            --tag "$RELEASE_TAG" \
            --notes "docs/releases/$RELEASE_TAG.md")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Dependency audit
        run: npm audit --audit-level=critical

      - name: License inventory
        run: npm run license:inventory

      - run: npm run commitlint
      - run: npm run lint
      - run: npm run format:check
      - run: npm run lint:md
      - run: npm run test:coverage
      - run: npm run build

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-coverage-${{ env.RELEASE_TAG }}
          path: coverage/
          if-no-files-found: ignore

  package:
    needs: validate
    runs-on: windows-latest
    environment: release
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Require release credentials
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
        run: |
          $required = @{
            GH_TOKEN = $env:GH_TOKEN
          }
          foreach ($entry in $required.GetEnumerator()) {
            if ([string]::IsNullOrWhiteSpace($entry.Value)) {
              throw "Missing release credential or variable: $($entry.Key)"
            }
          }

      - name: Verify public release access
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
        run: |
          gh api "repos/$env:RELEASE_REPOSITORY" --silent
          if ($LASTEXITCODE -ne 0) {
            throw 'PUBLIC_RELEASE_TOKEN cannot access the release repository'
          }

      - run: npm ci

      - name: Recheck release contract
        shell: pwsh
        run: |
          $version = npm run --silent release:verify-version -- `
            --tag $env:RELEASE_TAG `
            --notes "docs/releases/$env:RELEASE_TAG.md"
          if ($version.Trim() -ne $env:RELEASE_VERSION) {
            throw 'Release version changed between validation and packaging'
          }

      - name: Build unsigned updater bundle
        run: npm run dist

      - name: Verify unsigned updater bundle and create checksum
        shell: pwsh
        run: ./scripts/verify-unsigned-windows-package.ps1 -Version $env:RELEASE_VERSION -WriteChecksum

      - name: Upload unsigned updater bundle
        uses: actions/upload-artifact@v7
        with:
          name: utawakui-${{ env.RELEASE_VERSION }}-unsigned-updater
          path: |
            release/Utawakui-Setup-${{ env.RELEASE_VERSION }}.exe
            release/Utawakui-Setup-${{ env.RELEASE_VERSION }}.exe.blockmap
            release/latest.yml
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Create or update public draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
        run: |
          $installer = "release/Utawakui-Setup-$env:RELEASE_VERSION.exe"
          $blockmap = "$installer.blockmap"
          $metadata = 'release/latest.yml'
          $checksum = 'release/SHA256SUMS.txt'
          $notes = "docs/releases/$env:RELEASE_TAG.md"
          $title = "Utawakui $env:RELEASE_VERSION"

          $releaseJson = gh release view $env:RELEASE_TAG `
            --repo $env:RELEASE_REPOSITORY `
            --json isDraft,isPrerelease 2>$null

          if ($LASTEXITCODE -eq 0) {
            $release = $releaseJson | ConvertFrom-Json
            if (-not $release.isDraft) {
              throw 'Refusing to modify an already published release'
            }
            if ($release.isPrerelease) {
              throw 'Stable workflow cannot update a prerelease'
            }
            gh release edit $env:RELEASE_TAG `
              --repo $env:RELEASE_REPOSITORY `
              --draft `
              --title $title `
              --notes-file $notes
            if ($LASTEXITCODE -ne 0) { throw 'Failed to update draft release' }
            gh release upload $env:RELEASE_TAG `
              $installer $blockmap $metadata $checksum `
              --repo $env:RELEASE_REPOSITORY `
              --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Failed to upload release assets' }
          } else {
            gh release create $env:RELEASE_TAG `
              $installer $blockmap $metadata $checksum `
              --repo $env:RELEASE_REPOSITORY `
              --target main `
              --draft `
              --title $title `
              --notes-file $notes
            if ($LASTEXITCODE -ne 0) { throw 'Failed to create draft release' }
          }
