name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag to rebuild
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_REPOSITORY: yPinn/Utawakui-Releases
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.release-version.outputs.version }}
    steps:
      - name: Require workflow dispatched from release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          WORKFLOW_REF_NAME: ${{ github.ref_name }}
          WORKFLOW_REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$WORKFLOW_REF_TYPE" != "tag" ] || [ "$WORKFLOW_REF_NAME" != "$RELEASE_TAG" ]; then
            echo "Select the release tag in 'Use workflow from' and use the same tag input." >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Require tag commit on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main

      - name: Gitleaks secret scan
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f # v8.30.1
        with:
          args: detect --source . --verbose --redact

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Dependency audit
        run: npm audit --audit-level=critical

      - run: npm ci

      - name: Verify release version and notes
        id: release-version
        run: |
          version="$(npm run --silent release:verify-version -- \
            --tag "$RELEASE_TAG" \
            --notes "docs/releases/$RELEASE_TAG.md")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: License inventory
        run: npm run license:inventory

      - run: npm run commitlint
      - run: npm run lint
      - run: npm run format:check
      - run: npm run lint:md
      - run: npm run test:coverage
      - run: npm run build

      - name: Upload coverage report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-coverage-${{ env.RELEASE_TAG }}
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

  package:
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 20
    environment: release
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Require release credentials
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
        run: |
          $required = @{
            GH_TOKEN = $env:GH_TOKEN
          }
          foreach ($entry in $required.GetEnumerator()) {
            if ([string]::IsNullOrWhiteSpace($entry.Value)) {
              throw "Missing release credential or variable: $($entry.Key)"
            }
          }

      - name: Verify public release access
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
        run: |
          gh api "repos/$env:RELEASE_REPOSITORY" --silent
          if ($LASTEXITCODE -ne 0) {
            throw 'PUBLIC_RELEASE_TOKEN cannot access the release repository'
          }

      - run: npm ci

      - name: Recheck release contract
        shell: pwsh
        run: |
          $version = npm run --silent release:verify-version -- `
            --tag $env:RELEASE_TAG `
            --notes "docs/releases/$env:RELEASE_TAG.md"
          if ($version.Trim() -ne $env:RELEASE_VERSION) {
            throw 'Release version changed between validation and packaging'
          }

      - name: Build unsigned updater bundle
        run: npm run dist

      - name: Verify unsigned updater bundle and create checksum
        shell: pwsh
        run: ./scripts/verify-unsigned-windows-package.ps1 -Version $env:RELEASE_VERSION -WriteChecksum

      - name: Create or update public draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
        run: |
          $installer = "release/Utawakui-Setup-$env:RELEASE_VERSION.exe"
          $blockmap = "$installer.blockmap"
          $metadata = 'release/latest.yml'
          $checksum = 'release/SHA256SUMS.txt'
          $notes = "docs/releases/$env:RELEASE_TAG.md"
          $title = "Utawakui $env:RELEASE_VERSION"

          $releaseJson = gh release view $env:RELEASE_TAG `
            --repo $env:RELEASE_REPOSITORY `
            --json isDraft,isPrerelease 2>$null

          if ($LASTEXITCODE -eq 0) {
            $release = $releaseJson | ConvertFrom-Json
            if (-not $release.isDraft) {
              throw 'Refusing to modify an already published release'
            }
            if ($release.isPrerelease) {
              throw 'Stable workflow cannot update a prerelease'
            }
            gh release edit $env:RELEASE_TAG `
              --repo $env:RELEASE_REPOSITORY `
              --draft `
              --title $title `
              --notes-file $notes
            if ($LASTEXITCODE -ne 0) { throw 'Failed to update draft release' }
            gh release upload $env:RELEASE_TAG `
              $installer $blockmap $metadata $checksum `
              --repo $env:RELEASE_REPOSITORY `
              --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Failed to upload release assets' }
          } else {
            gh release create $env:RELEASE_TAG `
              $installer $blockmap $metadata $checksum `
              --repo $env:RELEASE_REPOSITORY `
              --target main `
              --draft `
              --title $title `
              --notes-file $notes
            if ($LASTEXITCODE -ne 0) { throw 'Failed to create draft release' }
          }

      - name: Upload failed release recovery bundle
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: utawakui-${{ env.RELEASE_VERSION }}-failed-release-recovery
          path: |
            release/Utawakui-Setup-${{ env.RELEASE_VERSION }}.exe
            release/Utawakui-Setup-${{ env.RELEASE_VERSION }}.exe.blockmap
            release/latest.yml
            release/SHA256SUMS.txt
          if-no-files-found: ignore
          retention-days: 3
