name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag to rebuild
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_REPOSITORY: yPinn/Utawakui-Releases
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.release-version.outputs.version }}
      signed_manifest_enabled: ${{ steps.signing-policy.outputs.signed_manifest_enabled }}
      active_key_id: ${{ steps.signing-policy.outputs.active_key_id }}
      retiring_key_id: ${{ steps.signing-policy.outputs.retiring_key_id }}
    steps:
      - name: Require workflow dispatched from release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          WORKFLOW_REF_NAME: ${{ github.ref_name }}
          WORKFLOW_REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$WORKFLOW_REF_TYPE" != "tag" ] || [ "$WORKFLOW_REF_NAME" != "$RELEASE_TAG" ]; then
            echo "Select the release tag in 'Use workflow from' and use the same tag input." >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Require tag commit on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main

      - name: Gitleaks secret scan
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f # v8.30.1
        with:
          args: detect --source . --verbose --redact

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Validate update signing policy
        id: signing-policy
        run: node scripts/update-signing-policy.mjs --github-output

      - name: Dependency audit
        run: npm audit --audit-level=critical

      - run: npm ci

      - name: Verify release version and notes
        id: release-version
        run: |
          version="$(npm run --silent release:verify-version -- \
            --tag "$RELEASE_TAG" \
            --notes "docs/releases/$RELEASE_TAG.md")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: License inventory
        run: npm run license:inventory

      - run: npm run commitlint
      - run: npm run lint
      - run: npm run format:check
      - run: npm run lint:md
      - run: npm run test:coverage
      - run: npm run build

      - name: Upload coverage report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-coverage-${{ env.RELEASE_TAG }}
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

  package:
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Recheck release contract
        shell: pwsh
        run: |
          $version = npm run --silent release:verify-version -- `
            --tag $env:RELEASE_TAG `
            --notes "docs/releases/$env:RELEASE_TAG.md"
          if ($version.Trim() -ne $env:RELEASE_VERSION) {
            throw 'Release version changed between validation and packaging'
          }

      - name: Build unsigned updater bundle
        run: npm run dist

      - name: Verify unsigned updater bundle and create checksum
        shell: pwsh
        run: ./scripts/verify-unsigned-windows-package.ps1 -Version $env:RELEASE_VERSION -WriteChecksum

      - name: Upload verified updater bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: utawakui-${{ needs.validate.outputs.version }}-updater-bundle
          path: |
            release/Utawakui-Setup-${{ needs.validate.outputs.version }}.exe
            release/Utawakui-Setup-${{ needs.validate.outputs.version }}.exe.blockmap
            release/latest.yml
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 3

      - name: Upload failed package recovery bundle
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: utawakui-${{ env.RELEASE_VERSION }}-failed-package-recovery
          path: |
            release/Utawakui-Setup-${{ env.RELEASE_VERSION }}.exe
            release/Utawakui-Setup-${{ env.RELEASE_VERSION }}.exe.blockmap
            release/latest.yml
            release/SHA256SUMS.txt
          if-no-files-found: ignore
          retention-days: 3

  sign:
    needs: [validate, package]
    if: needs.validate.outputs.signed_manifest_enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: update-signing
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      ACTIVE_KEY_ID: ${{ needs.validate.outputs.active_key_id }}
      RETIRING_KEY_ID: ${{ needs.validate.outputs.retiring_key_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Download verified updater bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: utawakui-${{ needs.validate.outputs.version }}-updater-bundle
          path: release

      - name: Require signing credentials
        env:
          UPDATE_MANIFEST_PRIVATE_KEY_B64: ${{ secrets.UPDATE_MANIFEST_PRIVATE_KEY_B64 }}
          UPDATE_MANIFEST_RETIRING_PRIVATE_KEY_B64: ${{ secrets.UPDATE_MANIFEST_RETIRING_PRIVATE_KEY_B64 }}
        run: |
          if [ -z "$UPDATE_MANIFEST_PRIVATE_KEY_B64" ]; then
            echo 'Missing UPDATE_MANIFEST_PRIVATE_KEY_B64' >&2
            exit 1
          fi
          if [ -n "$RETIRING_KEY_ID" ] && [ -z "$UPDATE_MANIFEST_RETIRING_PRIVATE_KEY_B64" ]; then
            echo 'Registry requires UPDATE_MANIFEST_RETIRING_PRIVATE_KEY_B64' >&2
            exit 1
          fi
          if [ -z "$RETIRING_KEY_ID" ] && [ -n "$UPDATE_MANIFEST_RETIRING_PRIVATE_KEY_B64" ]; then
            echo 'Retiring signing secret exists without a retiring registry key' >&2
            exit 1
          fi

      - name: Materialize signing key
        env:
          UPDATE_MANIFEST_PRIVATE_KEY_B64: ${{ secrets.UPDATE_MANIFEST_PRIVATE_KEY_B64 }}
          UPDATE_MANIFEST_RETIRING_PRIVATE_KEY_B64: ${{ secrets.UPDATE_MANIFEST_RETIRING_PRIVATE_KEY_B64 }}
        run: |
          umask 077
          printf '%s' "$UPDATE_MANIFEST_PRIVATE_KEY_B64" | base64 --decode > "$RUNNER_TEMP/update-signing-private-key.pem"
          if [ -n "$RETIRING_KEY_ID" ]; then
            printf '%s' "$UPDATE_MANIFEST_RETIRING_PRIVATE_KEY_B64" | base64 --decode > "$RUNNER_TEMP/update-signing-retiring-private-key.pem"
          fi

      - name: Sign update manifest
        run: |
          release_date="$(git show -s --format=%cI "$RELEASE_TAG")"
          key_args=(--private-key "$RUNNER_TEMP/update-signing-private-key.pem")
          if [ -s "$RUNNER_TEMP/update-signing-retiring-private-key.pem" ]; then
            key_args+=(--private-key "$RUNNER_TEMP/update-signing-retiring-private-key.pem")
          fi
          node tools/update-signing/sign-manifest.mjs \
            --version "$RELEASE_VERSION" \
            --release-date "$release_date" \
            "${key_args[@]}" \
            --expected-key-id "$ACTIVE_KEY_ID" \
            --out release/update-manifest.json \
            "release/Utawakui-Setup-$RELEASE_VERSION.exe"

      - name: Verify signed update manifest
        run: |
          required_key_args=()
          if [ -n "$RETIRING_KEY_ID" ]; then
            required_key_args+=(--required-key-id "$RETIRING_KEY_ID")
          fi
          node tools/update-signing/verify-manifest.mjs \
            --version "$RELEASE_VERSION" \
            --expected-key-id "$ACTIVE_KEY_ID" \
            "${required_key_args[@]}" \
            --manifest release/update-manifest.json \
            --registry shared/updateSigningKeys.json \
            --artifact-dir release

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/update-signing-private-key.pem" "$RUNNER_TEMP/update-signing-retiring-private-key.pem"

      - name: Upload signed update manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: utawakui-${{ needs.validate.outputs.version }}-signed-manifest
          path: release/update-manifest.json
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [validate, package, sign]
    if: >-
      always() &&
      needs.validate.result == 'success' &&
      needs.package.result == 'success' &&
      (needs.sign.result == 'success' || needs.sign.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      SIGNED_MANIFEST_ENABLED: ${{ needs.validate.outputs.signed_manifest_enabled }}
      ACTIVE_KEY_ID: ${{ needs.validate.outputs.active_key_id }}
      RETIRING_KEY_ID: ${{ needs.validate.outputs.retiring_key_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install verification dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Download verified updater bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: utawakui-${{ needs.validate.outputs.version }}-updater-bundle
          path: release

      - name: Download signed update manifest
        if: needs.validate.outputs.signed_manifest_enabled == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: utawakui-${{ needs.validate.outputs.version }}-signed-manifest
          path: release

      - name: Verify downloaded updater bundle
        run: |
          node scripts/release-contract-cli.mjs artifacts \
            --version "$RELEASE_VERSION" \
            --directory release
          pushd release
          sha256sum --check SHA256SUMS.txt
          popd

      - name: Verify signed update manifest
        if: needs.validate.outputs.signed_manifest_enabled == 'true'
        run: |
          required_key_args=()
          if [ -n "$RETIRING_KEY_ID" ]; then
            required_key_args+=(--required-key-id "$RETIRING_KEY_ID")
          fi
          node tools/update-signing/verify-manifest.mjs \
            --version "$RELEASE_VERSION" \
            --expected-key-id "$ACTIVE_KEY_ID" \
            "${required_key_args[@]}" \
            --manifest release/update-manifest.json \
            --registry shared/updateSigningKeys.json \
            --artifact-dir release

      - name: Require release credentials
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo 'Missing PUBLIC_RELEASE_TOKEN' >&2
            exit 1
          fi

      - name: Verify public release access
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
        run: |
          gh api "repos/$RELEASE_REPOSITORY" --silent

      - name: Create or update public draft release
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
        run: |
          installer="release/Utawakui-Setup-$RELEASE_VERSION.exe"
          assets=(
            "$installer"
            "$installer.blockmap"
            release/latest.yml
            release/SHA256SUMS.txt
          )
          if [ "$SIGNED_MANIFEST_ENABLED" = 'true' ]; then
            assets+=(release/update-manifest.json)
          fi
          notes="docs/releases/$RELEASE_TAG.md"
          title="Utawakui $RELEASE_VERSION"

          if release_json="$(gh release view "$RELEASE_TAG" \
            --repo "$RELEASE_REPOSITORY" \
            --json isDraft,isPrerelease 2>/dev/null)"; then
            is_draft="$(printf '%s' "$release_json" | node -pe "JSON.parse(require('fs').readFileSync(0, 'utf8')).isDraft")"
            is_prerelease="$(printf '%s' "$release_json" | node -pe "JSON.parse(require('fs').readFileSync(0, 'utf8')).isPrerelease")"
            if [ "$is_draft" != 'true' ]; then
              echo 'Refusing to modify an already published release' >&2
              exit 1
            fi
            if [ "$is_prerelease" = 'true' ]; then
              echo 'Stable workflow cannot update a prerelease' >&2
              exit 1
            fi
            gh release edit "$RELEASE_TAG" \
              --repo "$RELEASE_REPOSITORY" \
              --draft \
              --title "$title" \
              --notes-file "$notes"
            gh release upload "$RELEASE_TAG" "${assets[@]}" \
              --repo "$RELEASE_REPOSITORY" \
              --clobber
          } else {
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --repo "$RELEASE_REPOSITORY" \
              --target main \
              --draft \
              --title "$title" \
              --notes-file "$notes"
          fi

      - name: Upload failed release recovery bundle
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: utawakui-${{ env.RELEASE_VERSION }}-failed-release-recovery
          path: |
            release/Utawakui-Setup-${{ env.RELEASE_VERSION }}.exe
            release/Utawakui-Setup-${{ env.RELEASE_VERSION }}.exe.blockmap
            release/latest.yml
            release/SHA256SUMS.txt
            release/update-manifest.json
          if-no-files-found: ignore
          retention-days: 3
