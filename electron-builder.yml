# electron-builder config for Windows packaging.
#
# YAML, not electron-builder.config.js — electron/**/*.js in this repo is
# CommonJS and src/**/*.js is ESM; YAML sidesteps
# the question of which convention a root-level *.config.js should follow.

appId: com.utawakui.app
# Must equal appUserModelId in shared/appIdentity.json, or the Start Menu
# shortcut's AUMID won't match the running app's, and the SMTC card keeps
# showing "未知的應用程式" even after installing.
productName: Utawakui
# Keep packaging deterministic even if a developer checkout has an older
# Electron distribution locked by a running dev session.
electronVersion: 43.8.3
afterPack: scripts/afterPackThirdPartyNotices.cjs
beforePack: scripts/beforePackReleaseRuntime.cjs
extraMetadata:
  main: runtime/main.cjs
# Must equal productName in shared/appIdentity.json / app.setName() — this is the
# folder name under app.getPath('userData'). A mismatch here silently moves
# config.json and the downloaded .onnx models out from under an existing
# install.

directories:
  output: release
  # Not "dist" — that's Vite's build output, which electron/main.js's
  # loadFile() reads directly.

# Fixed runtime invariants, applied to every packaged executable. The app still
# loads its main renderer from file://, so GrantFileProtocolExtraPrivileges must
# remain enabled until that UI moves behind an app-owned custom scheme.
electronFuses:
  # Bounded app-owned Node subprocesses: ADR 0005 provider EJS and ADR 0026
  # ONNX environment probes use the packaged executable as their Node runtime.
  runAsNode: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: true

# This only writes the public feed identity into packaged update metadata.
# Local dist commands and the release build both use --publish never. The
# release workflow uploads only the verified updater artifacts to a public
# draft release. Packaged Windows builds check only this stable public feed.
publish:
  provider: github
  owner: yPinn
  repo: Utawakui-Releases
  releaseType: release

files:
  # App-owned Main/preloads/workers are built independently from the renderer.
  # beforePack regenerates these seven minified CJS entries from current source.
  - runtime/*.cjs
  - scripts/research/lyricsAcoustic/assets.cjs
  - scripts/research/lyricsAcoustic/process.cjs
  - scripts/research/lyricsAcoustic/protocol.cjs
  - scripts/research/lyricsAcoustic/english.cjs
  - scripts/research/lyricsAcoustic/job.cjs
  - scripts/research/lyricsAcoustic/frontend.cjs
  - scripts/research/lyricsAcoustic/decoder.py
  - scripts/research/lyricsAcoustic/manifest.json
  - scripts/research/lyricsAlignmentCandidates/protocol.cjs
  - scripts/research/lyricsAlignmentCandidates/tokenStarts.cjs
  - scripts/research/lyricsAlignmentCandidates/quality.cjs
  - scripts/research/lyricsAlignmentCandidates/qualityConservative.cjs
  - scripts/research/lyricsFreshEvaluation/content.cjs
  - scripts/research/lyricsFreshEvaluation/lowCost.cjs
  - scripts/research/lyricsFreshEvaluation/completeness.cjs
  - scripts/research/lyricsFreshEvaluation/trial-assets.json
  # Includes nested HTML at dist/src/entries/prompter/index.html.
  - dist/**/*
  # Original electron/ and src/ modules, adjacent tests and fixture corpora
  # are absent from the package; their runtime code is inside the bundles.
  # Main only reads the shell icon; the renderer's PNG icons ship via dist/.
  - public/assets/icons/app-icon.ico
  # Independent Browser Source pages and the single inspection guide source.
  # Includes receipt setlist DOM/motion/CSS and its textless paper/grain plates;
  # shared/presentation/receiptSetlist.mjs supplies its pure frame/page rules.
  # Includes lyricsFit/ktvDisplayFit local geometry adapters; shared owns display planners.
  # Fine text paint includes lyricsFine.mjs, shared/browser/lyricsFinePaint.mjs,
  # shared/lyricsFineTiming.mjs with browser-safe, versioned bounds.
  - overlay/**/*
  - '!overlay/**/*.test.js'
  - shared/**/*
  - '!shared/**/*.test.js'
  - LICENSE.md
  - THIRD_PARTY_NOTICES.md
  - package.json
  # onnxruntime-node ships native binaries for every platform in one
  # tarball; only win32/x64 is used here (thumbar/SMTC/DirectML are all
  # Windows-only features), so the rest is dead weight in the installer.
  - '!node_modules/onnxruntime-node/bin/napi-v6/darwin/**/*'
  - '!node_modules/onnxruntime-node/bin/napi-v6/linux/**/*'
  - '!node_modules/onnxruntime-node/bin/napi-v6/win32/arm64/**/*'
  # kuromoji's npm package has no "files" field, so its whole repo content
  # ships — test/ alone is 22MB, unzipped, and none of these four are ever
  # read at runtime (main is src/kuromoji.js, not build/).
  - '!node_modules/kuromoji/test/**/*'
  - '!node_modules/kuromoji/demo/**/*'
  - '!node_modules/kuromoji/example/**/*'
  - '!node_modules/kuromoji/build/**/*'
  # The output server serves only gsap.min.js to the Browser Source; the
  # package's other builds, sources and plugins are never loaded.
  - '!node_modules/gsap/**/*'
  - node_modules/gsap/package.json
  - node_modules/gsap/dist/gsap.min.js
  # queryVariants.js requires only the UMD cn2t/t2cn converters; keep those
  # and the license files, drop the ESM builds and the full bundle.
  - '!node_modules/opencc-js/dist/esm/**/*'
  - '!node_modules/opencc-js/dist/esm-lib/**/*'
  - '!node_modules/opencc-js/dist/umd/full.js'
  - '!node_modules/opencc-js/types/**/*'

asarUnpack:
  - scripts/research/lyricsAcoustic/manifest.json
  - scripts/research/lyricsAcoustic/frontend.cjs
  - scripts/research/lyricsAcoustic/decoder.py
  # Native N-API module — onnxruntime.dll/DirectML.dll must land in the same
  # unpacked directory as the .node binding, so the whole bin/ tree is
  # unpacked rather than just **/*.node.
  - node_modules/onnxruntime-node/bin/**/*
  - node_modules/onnxruntime-node/dist/**/*
  - node_modules/onnxruntime-node/package.json
  - node_modules/onnxruntime-common/dist/cjs/**/*
  - node_modules/onnxruntime-common/package.json
  - node_modules/kissfft-js/**/*
  # Workers/probes execute in a plain Node context. Their app-owned dependency
  # graphs are self-contained; only these four bundles require real disk paths.
  - runtime/reading.cjs
  - runtime/waveform.cjs
  - runtime/separation.cjs
  - runtime/probe.cjs
  # Waveform metadata/hash worker uses plain Node, including metadata's ESM graph.
  - node_modules/music-metadata/**/*
  - node_modules/@borewit/text-codec/**/*
  - node_modules/@tokenizer/inflate/**/*
  - node_modules/content-type/**/*
  - node_modules/debug/**/*
  - node_modules/file-type/**/*
  - node_modules/ieee754/**/*
  - node_modules/media-typer/**/*
  - node_modules/ms/**/*
  - node_modules/strtok3/**/*
  - node_modules/token-types/**/*
  - node_modules/uint8array-extras/**/*
  - node_modules/win-guid/**/*
  # Read directly by Windows shell APIs (setAppDetails's appIconPath in
  # electron/main.js), not through Electron/Node's own fs layer.
  - public/assets/icons/app-icon.ico
  # reading.cjs (unpacked above) requires these
  # inside the worker thread, which has its own Node context without
  # Electron's asar fs patch — same reasoning as onnxruntime-node's bin/
  # above, but here the whole package (not just a native binary) is what a
  # worker-thread require()/fs.readFile() needs resolvable on real disk:
  # kuromoji's dictionary is read via fs.readFile, and wanakana is
  # require()'d directly.
  - node_modules/kuromoji/**/*
  # Include kuromoji's actual Node require graph, including builder-hoisted
  # dependencies. Worker checks reject fallback to a developer node_modules.
  - node_modules/async/**/*
  - node_modules/doublearray/**/*
  - node_modules/zlibjs/**/*
  - node_modules/lodash/**/*
  - node_modules/wanakana/**/*
  # Same worker-thread require() reasoning as kuromoji/wanakana above —
  # koroman (Stage 5c, Korean romanization) is tiny (~40KB, zero deps) but
  # still needs to resolve from real disk, not just inside asar.
  - node_modules/koroman/**/*
  # Spout2 shared-texture sender is loaded only by the isolated helper process.
  # Its platform binding and DLL dependencies must resolve from the real disk.
  - node_modules/@napolab/texture-bridge*/**/*

# App-owned workers only. Provider Python and the independent Audio Python /
# PyTorch runtime remain explicit, removable downloads under userData; no
# interpreter, provider package, or model is bundled into the base installer.
extraResources:
  # Full texts stay readable outside ASAR, with pinned version/checksum metadata.
  - from: third-party
    to: third-party
    filter:
      - NOTICES.txt
      - manifest.json
  - from: resources/audio-processing/audio_python_worker.py
    to: audio-processing/audio_python_worker.py
  - from: resources/audio-processing/lyrics_acoustic_probe.py
    to: audio-processing/lyrics_acoustic_probe.py
  - from: resources/audio-processing/lyrics-acoustic-catalog.json
    to: audio-processing/lyrics-acoustic-catalog.json
  - from: resources/audio-processing/refined_worker.py
    to: audio-processing/refined_worker.py
  - from: resources/audio-processing/structure_analysis_worker.py
    to: audio-processing/structure_analysis_worker.py
  - from: resources/audio-processing/analysis-structure-model.json
    to: audio-processing/analysis-structure-model.json
  - from: resources/audio-processing/analysis-beat-this-small0-model.json
    to: audio-processing/analysis-beat-this-small0-model.json
  - from: resources/audio-processing/analysis-beat-this-final0-model.json
    to: audio-processing/analysis-beat-this-final0-model.json
  - from: resources/audio-processing/analysis-beat-this-py314-lock.json
    to: audio-processing/analysis-beat-this-py314-lock.json
  - from: resources/audio-processing/audio-python-runtime-3.14.7.json
    to: audio-processing/audio-python-runtime-3.14.7.json
  - from: resources/provider/artist_photo_ytmusic_worker.py
    to: provider/artist_photo_ytmusic_worker.py
  - from: resources/provider/release_catalog_worker.py
    to: provider/release_catalog_worker.py

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: dir
      arch:
        - x64
  icon: public/assets/icons/app-icon.ico
  # Keep as "electron" — renaming it FATALs once onnxruntime-node/DirectML
  # is bundled. See docs/adr/0002-packaged-exe-kept-as-electron-exe.md.
  # This literal filename also makes Electron 43 report app.isPackaged=false;
  # product code must use main/runtimeEnvironment.js's app.asar detector.
  executableName: electron
  # Normal local builds and the active public release workflow remain unsigned.
  # The optional dist:release maintainer command can still override this for a
  # future signing experiment. This does not skip icon/version-info resource
  # editing (signAndEditExecutable is a separate flag).
  signExecutable: false
  # The current product channel deliberately ships without a paid Authenticode
  # publisher identity. electron-updater still verifies the installer SHA-512
  # from latest.yml over the fixed HTTPS GitHub feed, but it must not expect a
  # publisher name that an unsigned installer cannot provide.
  verifyUpdateCodeSignature: false

nsis:
  # Optional uninstaller checkboxes for app data cleanup — opt-in, not
  # deleteAppDataOnUninstall, since the local music library is user content.
  include: build/installer.nsh
  # Assisted (wizard) installer, not oneClick — oneClick has no real finish
  # page to carry a "Launch Utawakui" checkbox.
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  # oneClick: false + perMachine: false shows the install-mode page (assisted
  # installer, and the assistedInstaller.nsh template only inserts
  # PAGE_INSTALL_MODE when INSTALL_MODE_PER_ALL_USERS isn't forced), letting
  # the user pick per-machine instead. That's safe to leave available: what
  # actually keeps app-managed workflow dependencies writable without elevation
  # either way is that they install under app.getPath('userData'), which has
  # nothing to do with install mode.
  allowElevation: true
  # Keep createDesktopShortcut enabled so electron-builder leaves the standard
  # desktop shortcut machinery available; build/installer.nsh toggles
  # $isNoDesktopShortcut from a custom checked-by-default page.
  createDesktopShortcut: true
  createStartMenuShortcut: true
  # This is the concrete fix for the SMTC "未知的應用程式" label: Windows
  # resolves the now-playing app name from the AUMID registered on this
  # Start Menu shortcut.
  # runAfterFinish left at its default (true) — assisted mode's finish page
  # shows a real "Run Utawakui" checkbox now, and launching is confirmed
  # working (see win.executableName above).
  # zh_TW first: OS-language detection falls back to the first entry when
  # neither matches, and every custom string in installer.nsh is bilingual
  # zh_TW/en_US, so there's no third language to fall further back to.
  installerLanguages:
    - zh_TW
    - en_US
  # Lets the user override the OS-language guess. Not "recommended" by
  # upstream docs for the general case, but that guidance assumes OS
  # language is good enough — here it's deliberately overridable.
  displayLanguageSelector: true
  # Default artifact names contain spaces; keep the release filename stable.
  artifactName: '${productName}-Setup-${version}.${ext}'
