<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Utawakui Lyrics Overlay</title>
    <link
      rel="preload"
      href="/shared/assets/fonts/jf-open-huninn-2.1.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <link rel="stylesheet" href="/overlay/shared/base.css" />
    <link rel="stylesheet" href="/overlay/shared/fallback.css" />
    <link rel="stylesheet" href="/overlay/shared/tokens.css" />
    <link rel="stylesheet" href="/overlay/lyrics/lyrics.css" />
    <link rel="stylesheet" href="/overlay/shared/appearance.css" />
    <script src="/overlay/vendor/gsap.min.js"></script>
    <script type="module" src="/overlay/lyrics/lyrics.mjs"></script>
  </head>
  <body>
    <div class="lyrics-workbench__backdrop" aria-hidden="true"></div>
    <div class="lyrics-workbench__guide" aria-hidden="true">
      <div class="lyrics-workbench__guide-region"></div>
    </div>
    <main
      id="lyrics-overlay"
      class="lyrics-overlay"
      aria-live="polite"
      aria-atomic="true"
      dir="auto"
      hidden
    >
      <div
        id="lyrics-live-stage-chrome"
        class="lyrics-overlay__live-stage-chrome"
        aria-hidden="true"
        hidden
      >
        <div class="lyrics-overlay__live-stage-brand">
          <strong class="lyrics-overlay__live-stage-brand-mark">U</strong>
          <span class="lyrics-overlay__live-stage-brand-copy">
            <span>UTAWAKUI</span>
            <strong>LIVE STAGE</strong>
          </span>
        </div>
        <strong class="lyrics-overlay__live-stage-channel">UW</strong>
      </div>
      <section
        id="lyrics-live-stage-card"
        class="lyrics-overlay__live-stage-card"
        hidden
      >
        <span class="lyrics-overlay__live-stage-card-mark" aria-hidden="true">
          <strong>U</strong>
          <span>LIVE</span>
        </span>
        <span class="lyrics-overlay__live-stage-card-copy">
          <strong
            id="lyrics-live-stage-title"
            class="lyrics-overlay__live-stage-title"
          ></strong>
          <span
            id="lyrics-live-stage-artist"
            class="lyrics-overlay__live-stage-artist"
          ></span>
        </span>
      </section>
      <div
        id="lyrics-manga-bubbles"
        class="lyrics-overlay__manga-bubbles"
        aria-hidden="true"
        hidden
      ></div>
      <p id="lyrics-current" class="lyrics-overlay__current"></p>
      <p id="lyrics-next" class="lyrics-overlay__next"></p>
    </main>
  </body>
</html>
