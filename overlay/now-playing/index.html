<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Utawakui Now Playing Overlay</title>
    <link rel="stylesheet" href="/overlay/shared/base.css" />
    <link rel="stylesheet" href="/overlay/shared/fallback.css" />
    <link rel="stylesheet" href="/overlay/shared/tokens.css" />
    <link rel="stylesheet" href="/overlay/now-playing/artwork.css" />
    <link rel="stylesheet" href="/overlay/shared/appearance.css" />
    <script src="/overlay/vendor/gsap.min.js"></script>
    <script type="module" src="/overlay/now-playing/now-playing.mjs"></script>
  </head>
  <body>
    <main id="artwork-overlay" class="artwork-overlay" dir="auto" hidden>
      <div class="artwork-overlay__vinyl-stage">
        <div class="artwork-overlay__album-panel">
          <div class="artwork-overlay__sleeve">
            <div class="artwork-overlay__mark" aria-hidden="true">
              <img
                id="artwork-image"
                class="artwork-overlay__image"
                alt=""
                hidden
              />
              <span
                id="artwork-fallback"
                class="artwork-overlay__fallback"
              ></span>
            </div>
            <div class="artwork-overlay__copy">
              <h1 id="artwork-title" class="artwork-overlay__title"></h1>
              <p id="artwork-artist" class="artwork-overlay__artist"></p>
            </div>
          </div>
          <div
            class="artwork-overlay__sleeve artwork-overlay__incoming-sleeve"
            aria-hidden="true"
            hidden
          >
            <div class="artwork-overlay__mark">
              <img
                class="artwork-overlay__image artwork-overlay__incoming-image"
                alt=""
                hidden
              />
              <span
                class="artwork-overlay__fallback artwork-overlay__incoming-fallback"
              ></span>
            </div>
            <div class="artwork-overlay__copy">
              <h1
                class="artwork-overlay__title artwork-overlay__incoming-title"
              ></h1>
              <p
                class="artwork-overlay__artist artwork-overlay__incoming-artist"
              ></p>
            </div>
          </div>
        </div>
        <div class="artwork-overlay__exchange-record" aria-hidden="true" hidden>
          <span
            class="artwork-overlay__record-rotor artwork-overlay__exchange-record-rotor"
          >
            <span class="artwork-overlay__record-dye"></span>
            <span class="artwork-overlay__record-shadow"></span>
            <span class="artwork-overlay__record-highlight"></span>
            <span class="artwork-overlay__record-grooves"></span>
          </span>
          <span class="artwork-overlay__record-label">UW</span>
        </div>
        <div class="artwork-overlay__turntable" aria-hidden="true">
          <span class="artwork-overlay__deck-light"></span>
          <div class="artwork-overlay__platter">
            <div class="artwork-overlay__record">
              <span class="artwork-overlay__record-rotor">
                <span class="artwork-overlay__record-dye"></span>
                <span class="artwork-overlay__record-shadow"></span>
                <span class="artwork-overlay__record-highlight"></span>
                <span class="artwork-overlay__record-grooves"></span>
              </span>
              <span class="artwork-overlay__record-label">UW</span>
            </div>
            <span class="artwork-overlay__platter-bloom"></span>
            <span class="artwork-overlay__spindle"></span>
          </div>
          <svg
            class="artwork-overlay__tonearm"
            viewBox="0 0 100 240"
            focusable="false"
          >
            <circle
              class="artwork-overlay__tonearm-pivot-edge"
              cx="66"
              cy="28"
              r="21"
            />
            <circle
              class="artwork-overlay__tonearm-pivot"
              cx="66"
              cy="28"
              r="18"
            />
            <path
              class="artwork-overlay__tonearm-pivot-highlight"
              d="M53 23 A14 14 0 0 1 72 16"
            />
            <circle
              class="artwork-overlay__tonearm-pivot-core"
              cx="66"
              cy="28"
              r="8"
            />
            <circle
              class="artwork-overlay__tonearm-pivot-pin"
              cx="66"
              cy="28"
              r="2.5"
            />
            <g class="artwork-overlay__tonearm-assembly">
              <rect
                class="artwork-overlay__tonearm-counterweight-edge"
                x="52"
                y="0"
                width="28"
                height="15"
                rx="7.5"
              />
              <rect
                class="artwork-overlay__tonearm-counterweight"
                x="53"
                y="1"
                width="26"
                height="13"
                rx="6.5"
              />
              <path
                class="artwork-overlay__tonearm-counterweight-highlight"
                d="M58 4h14"
              />
              <path
                class="artwork-overlay__tonearm-counterweight-cap"
                d="M76.5 3v9"
              />
              <path
                class="artwork-overlay__tonearm-rail-edge"
                d="M66 28 C69 78 42 134 11.5 179"
              />
              <path
                class="artwork-overlay__tonearm-rail"
                d="M66 28 C69 78 42 134 11.5 179"
              />
              <path
                class="artwork-overlay__tonearm-rail-highlight"
                d="M65 28 C67.5 73 46 122 20 165"
              />
              <g
                class="artwork-overlay__tonearm-head"
                transform="translate(11.5 179) rotate(17)"
              >
                <rect
                  class="artwork-overlay__tonearm-head-edge"
                  x="-7"
                  y="-5"
                  width="30"
                  height="15"
                  rx="4"
                />
                <rect
                  class="artwork-overlay__tonearm-head-body"
                  x="-6"
                  y="-4"
                  width="28"
                  height="13"
                  rx="3"
                />
                <path
                  class="artwork-overlay__tonearm-head-highlight"
                  d="M-2 -1h18"
                />
                <circle
                  class="artwork-overlay__tonearm-head-screw"
                  cx="16"
                  cy="5"
                  r="1.6"
                />
                <path
                  class="artwork-overlay__stylus artwork-overlay__stylus-cantilever"
                  d="M5 9v10"
                />
                <path class="artwork-overlay__stylus-tip" d="M5 19v4" />
              </g>
            </g>
            <g class="artwork-overlay__tonearm-rest">
              <rect
                class="artwork-overlay__tonearm-rest-base"
                x="85"
                y="116"
                width="12"
                height="6"
                rx="2"
              />
              <path
                class="artwork-overlay__tonearm-rest-post"
                d="M91 117v-12"
              />
              <path
                class="artwork-overlay__tonearm-rest-cradle"
                d="M84.5 108 Q91 114 97.5 108"
              />
            </g>
          </svg>
        </div>
      </div>
      <div class="artwork-overlay__player" aria-hidden="true">
        <div class="artwork-overlay__scrubber">
          <span class="artwork-overlay__scrubber-fill"></span>
        </div>
        <div class="artwork-overlay__timeline">
          <span id="artwork-elapsed">0:00</span>
          <span id="artwork-remaining">-0:00</span>
        </div>
        <div class="artwork-overlay__transport">
          <svg class="artwork-overlay__skip" viewBox="0 0 24 24">
            <path d="M12 5.5v13L2 12Zm10 0v13L12 12Z" />
          </svg>
          <span class="artwork-overlay__play-state">
            <svg class="artwork-overlay__play" viewBox="0 0 24 24">
              <path d="m8 5 11 7-11 7Z" />
            </svg>
            <svg class="artwork-overlay__pause" viewBox="0 0 24 24">
              <path d="M8 5v14M16 5v14" />
            </svg>
          </span>
          <svg class="artwork-overlay__skip" viewBox="0 0 24 24">
            <path d="M2 5.5v13L12 12Zm10 0v13L22 12Z" />
          </svg>
        </div>
        <div class="artwork-overlay__volume">
          <svg viewBox="0 0 24 24">
            <path d="M3 9h4l5-4v14l-5-4H3Z" />
            <path class="artwork-overlay__volume-wave" d="M16 8q4 4 0 8" />
            <path class="artwork-overlay__volume-mute" d="m16 9 6 6m0-6-6 6" />
          </svg>
          <span class="artwork-overlay__volume-track"></span>
        </div>
      </div>
    </main>
  </body>
</html>
