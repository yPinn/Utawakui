<!doctype html>
<html lang="zh-Hant" data-overlay-backdrop="transparent" data-ovl-weight="bold">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>票根式 Now Playing</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./ticket.css" />
    <script type="module" src="./main.mjs"></script>
  </head>
  <body>
    <main
      id="artwork-overlay"
      class="artwork-overlay now-playing-ticket"
      hidden
    >
      <div class="ticket-paper ticket-cut">
        <div class="artwork-overlay__mark ticket-cover" aria-hidden="true">
          <img
            id="artwork-image"
            class="artwork-overlay__image"
            alt=""
            hidden
          />
          <span id="artwork-fallback" class="artwork-overlay__fallback"></span>
        </div>
        <div class="artwork-overlay__copy ticket-copy" dir="auto">
          <h1
            id="artwork-title"
            class="artwork-overlay__title ticket-title"
            data-ovl-element="title"
          ></h1>
          <p
            id="artwork-artist"
            class="artwork-overlay__artist ticket-artist"
            data-ovl-element="artist"
          ></p>
        </div>
      </div>
    </main>
  </body>
</html>
