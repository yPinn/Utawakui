<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Utawakui Diagnostics Viewer</title>
    <style>
      :root {
        color-scheme: light dark;
        --canvas: #f7f1e7;
        --surface: #fffdfa;
        --surface-raised: #ffffff;
        --surface-hover: #edf2ef;
        --text: #1f2328;
        --text-muted: #69747a;
        --border: #d8ded9;
        --accent: #327a7f;
        --danger: #bd5961;
        --danger-soft: #f6dfe0;
        --warning: #b78336;
        --warning-soft: #f3ecd9;
        --info: #4d8793;
        --info-soft: #dcebee;
        --muted-soft: #e8e8e6;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --canvas: #1f2328;
          --surface: #292f35;
          --surface-raised: #30383e;
          --surface-hover: #344046;
          --text: #f7f1e7;
          --text-muted: #aeb8b6;
          --border: #3c4749;
          --accent: #55a2a7;
          --danger: #dd7078;
          --danger-soft: #4a2c2e;
          --warning: #d6a84f;
          --warning-soft: #3a3226;
          --info: #7fb8bd;
          --info-soft: #23393c;
          --muted-soft: #3a4046;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--canvas);
        color: var(--text);
        font-family:
          'Segoe UI',
          'Microsoft JhengHei UI',
          'Microsoft JhengHei',
          system-ui,
          -apple-system,
          sans-serif;
        font-size: 14px;
        line-height: 1.5;
      }

      main {
        max-width: 72rem;
        margin: 0 auto;
        padding: 1.5rem;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      h1 {
        font-size: 1.25rem;
        margin: 0;
      }

      p.subtitle {
        margin: 0.25rem 0 0;
        color: var(--text-muted);
      }

      #drop-zone {
        border: 2px dashed var(--border);
        border-radius: 0.75rem;
        padding: 3rem 1.5rem;
        text-align: center;
        color: var(--text-muted);
        cursor: pointer;
        background: var(--surface);
        transition:
          border-color 0.15s ease,
          background 0.15s ease;
      }

      #drop-zone.is-dragover {
        border-color: var(--accent);
        background: var(--surface-hover);
        color: var(--text);
      }

      #drop-zone strong {
        color: var(--text);
      }

      #file-input {
        display: none;
      }

      #error-banner {
        border: 1px solid var(--danger);
        background: var(--danger-soft);
        color: var(--text);
        border-radius: 0.5rem;
        padding: 0.75rem 1rem;
      }

      #app {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        flex-wrap: wrap;
      }

      button {
        font: inherit;
        cursor: pointer;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
        border-radius: 0.375rem;
        padding: 0.4rem 0.75rem;
      }

      button:hover {
        background: var(--surface-hover);
      }

      #summary {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr));
        gap: 0.75rem;
      }

      .summary-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 0.5rem;
        padding: 0.75rem 1rem;
      }

      .summary-card .label {
        color: var(--text-muted);
        font-size: 0.8125rem;
      }

      .summary-card .value {
        font-size: 1.125rem;
        font-weight: 600;
        word-break: break-all;
      }

      .level-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        padding: 0.2rem 0.6rem;
        border-radius: 999px;
        font-size: 0.8125rem;
        font-weight: 600;
        white-space: nowrap;
      }

      .chip--error {
        background: var(--danger-soft);
        color: var(--danger);
      }

      .chip--warning {
        background: var(--warning-soft);
        color: var(--warning);
      }

      .chip--info {
        background: var(--info-soft);
        color: var(--info);
      }

      .chip--debug {
        background: var(--muted-soft);
        color: var(--text-muted);
      }

      .filters {
        display: flex;
        align-items: center;
        gap: 1rem;
        flex-wrap: wrap;
      }

      .filters label {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        cursor: pointer;
      }

      #search {
        flex: 1 1 16rem;
        min-width: 12rem;
        padding: 0.4rem 0.6rem;
        border: 1px solid var(--border);
        border-radius: 0.375rem;
        background: var(--surface);
        color: var(--text);
        font: inherit;
      }

      #list {
        border: 1px solid var(--border);
        border-radius: 0.75rem;
        background: var(--surface);
        overflow: hidden;
      }

      .row {
        border-bottom: 1px solid var(--border);
      }

      .row:last-child {
        border-bottom: none;
      }

      .row summary {
        cursor: pointer;
        display: grid;
        grid-template-columns: max-content max-content max-content max-content 1fr;
        align-items: center;
        gap: 0.75rem;
        padding: 0.5rem 0.75rem;
        font-size: 0.8125rem;
      }

      .row summary::-webkit-details-marker {
        display: none;
      }

      .row summary:hover {
        background: var(--surface-hover);
      }

      .row .timestamp,
      .row .origin,
      .row .code {
        color: var(--text-muted);
        white-space: nowrap;
      }

      .row .message {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .row pre {
        margin: 0;
        padding: 0.75rem;
        border-top: 1px solid var(--border);
        background: var(--canvas);
        white-space: pre-wrap;
        word-break: break-word;
        user-select: text;
        font-size: 0.8125rem;
      }

      #empty-state {
        padding: 2rem;
        text-align: center;
        color: var(--text-muted);
      }

      #record-count {
        color: var(--text-muted);
        font-size: 0.8125rem;
      }
    </style>
  </head>
  <body>
    <main>
      <div>
        <h1>Utawakui Diagnostics Viewer</h1>
        <p class="subtitle">
          離線檢視工具，讀取 Settings
          匯出的診斷紀錄檔案。不連網、不上傳，檔案只在這個分頁裡處理。
        </p>
      </div>

      <div id="error-banner" hidden></div>

      <div
        id="drop-zone"
        tabindex="0"
        role="button"
        aria-label="開啟診斷紀錄檔案"
      >
        <div><strong>拖放診斷紀錄匯出檔案</strong>到這裡，或點一下選擇檔案</div>
        <div class="subtitle">
          接受 Settings「匯出錯誤紀錄」產生的 .json 檔案
        </div>
      </div>
      <input id="file-input" type="file" accept=".json,application/json" />

      <div id="app" hidden>
        <div class="toolbar">
          <span id="record-count"></span>
          <button type="button" id="load-another">開啟另一個檔案</button>
        </div>

        <div id="summary"></div>

        <div class="filters">
          <input
            id="search"
            type="search"
            placeholder="搜尋來源、操作、代碼或訊息"
          />
          <label
            ><input type="checkbox" data-level="error" checked /> 錯誤</label
          >
          <label
            ><input type="checkbox" data-level="warning" checked /> 警告</label
          >
          <label
            ><input type="checkbox" data-level="info" checked /> 資訊</label
          >
          <label
            ><input type="checkbox" data-level="debug" checked /> 除錯</label
          >
        </div>

        <div id="list"></div>
        <div id="empty-state" hidden>沒有符合條件的紀錄</div>
      </div>
    </main>

    <script>
      (function () {
        'use strict';

        var LEVEL_LABELS = {
          error: '錯誤',
          warning: '警告',
          info: '資訊',
          debug: '除錯',
        };

        var dropZone = document.getElementById('drop-zone');
        var fileInput = document.getElementById('file-input');
        var errorBanner = document.getElementById('error-banner');
        var app = document.getElementById('app');
        var summaryEl = document.getElementById('summary');
        var searchInput = document.getElementById('search');
        var listEl = document.getElementById('list');
        var emptyStateEl = document.getElementById('empty-state');
        var recordCountEl = document.getElementById('record-count');
        var loadAnotherButton = document.getElementById('load-another');
        var levelCheckboxes = Array.prototype.slice.call(
          document.querySelectorAll('input[data-level]'),
        );

        var currentBundle = null;

        function showError(message) {
          errorBanner.textContent = message;
          errorBanner.hidden = false;
        }

        function clearError() {
          errorBanner.hidden = true;
          errorBanner.textContent = '';
        }

        function escapeHtml(value) {
          return String(value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
        }

        function isPlainObject(value) {
          return (
            Boolean(value) && typeof value === 'object' && !Array.isArray(value)
          );
        }

        function validateBundle(bundle) {
          if (!isPlainObject(bundle)) {
            return '這不是有效的 JSON 物件。';
          }
          if (!Array.isArray(bundle.events)) {
            return '這個檔案沒有 events 陣列，看起來不是診斷紀錄匯出檔案。';
          }
          return null;
        }

        function renderSummary(bundle) {
          var counts = bundle.levelCounts || {};
          var chipsHtml = ['error', 'warning', 'info', 'debug']
            .map(function (level) {
              var count = Number.isFinite(counts[level]) ? counts[level] : 0;
              return (
                '<span class="chip chip--' +
                level +
                '">' +
                LEVEL_LABELS[level] +
                ' ' +
                count +
                '</span>'
              );
            })
            .join('');

          summaryEl.innerHTML =
            summaryCard('匯出時間', bundle.exportedAt || '（無）') +
            summaryCard('App 版本', bundle.appVersion || '（無）') +
            summaryCard('Electron 版本', bundle.electronVersion || '（無）') +
            summaryCard(
              '事件筆數',
              String(bundle.eventCount ?? bundle.events.length),
            ) +
            '<div class="summary-card"><div class="label">等級分布</div><div class="level-chips">' +
            chipsHtml +
            '</div></div>';
        }

        function summaryCard(label, value) {
          return (
            '<div class="summary-card"><div class="label">' +
            escapeHtml(label) +
            '</div><div class="value">' +
            escapeHtml(value) +
            '</div></div>'
          );
        }

        function activeLevels() {
          var active = {};
          levelCheckboxes.forEach(function (checkbox) {
            active[checkbox.dataset.level] = checkbox.checked;
          });
          return active;
        }

        function matchesSearch(event, needle) {
          if (!needle) return true;
          var fields = [
            event.source,
            event.operation,
            event.code,
            event.message,
          ];
          return fields.some(function (field) {
            return (
              typeof field === 'string' &&
              field.toLowerCase().indexOf(needle) !== -1
            );
          });
        }

        function renderList() {
          if (!currentBundle) return;
          var needle = searchInput.value.trim().toLowerCase();
          var active = activeLevels();
          var events = currentBundle.events.filter(function (event) {
            if (active[event.level] === false) return false;
            return matchesSearch(event, needle);
          });

          recordCountEl.textContent =
            events.length +
            ' / ' +
            currentBundle.events.length +
            ' 筆（符合篩選條件 / 總數）';

          if (events.length === 0) {
            listEl.innerHTML = '';
            emptyStateEl.hidden = false;
            return;
          }
          emptyStateEl.hidden = true;

          listEl.innerHTML = events
            .map(function (event) {
              var level = LEVEL_LABELS[event.level] ? event.level : 'debug';
              var label = LEVEL_LABELS[level] || event.level || '';
              return (
                '<details class="row"><summary>' +
                '<span class="chip chip--' +
                level +
                '">' +
                escapeHtml(label) +
                '</span>' +
                '<span class="timestamp">' +
                escapeHtml(event.timestamp || '') +
                '</span>' +
                '<span class="origin">' +
                escapeHtml(
                  (event.source || '') + '／' + (event.operation || ''),
                ) +
                '</span>' +
                '<span class="code">' +
                escapeHtml(event.code || '') +
                '</span>' +
                '<span class="message">' +
                escapeHtml(event.message || '') +
                '</span>' +
                '</summary><pre>' +
                escapeHtml(JSON.stringify(event, null, 2)) +
                '</pre></details>'
              );
            })
            .join('');
        }

        function loadBundleFromText(text) {
          var parsed;
          try {
            parsed = JSON.parse(text);
          } catch (error) {
            showError('無法解析這個檔案：不是有效的 JSON。');
            return;
          }

          var validationError = validateBundle(parsed);
          if (validationError) {
            showError(validationError);
            return;
          }

          clearError();
          currentBundle = parsed;
          dropZone.hidden = true;
          app.hidden = false;
          renderSummary(parsed);
          renderList();
        }

        function loadFile(file) {
          if (!file) return;
          var reader = new FileReader();
          reader.onload = function () {
            loadBundleFromText(String(reader.result));
          };
          reader.onerror = function () {
            showError('無法讀取這個檔案。');
          };
          reader.readAsText(file);
        }

        dropZone.addEventListener('click', function () {
          fileInput.click();
        });
        dropZone.addEventListener('keydown', function (event) {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            fileInput.click();
          }
        });
        dropZone.addEventListener('dragover', function (event) {
          event.preventDefault();
          dropZone.classList.add('is-dragover');
        });
        dropZone.addEventListener('dragleave', function () {
          dropZone.classList.remove('is-dragover');
        });
        dropZone.addEventListener('drop', function (event) {
          event.preventDefault();
          dropZone.classList.remove('is-dragover');
          var file = event.dataTransfer && event.dataTransfer.files[0];
          loadFile(file);
        });
        fileInput.addEventListener('change', function () {
          loadFile(fileInput.files[0]);
        });
        loadAnotherButton.addEventListener('click', function () {
          currentBundle = null;
          fileInput.value = '';
          app.hidden = true;
          dropZone.hidden = false;
          clearError();
        });
        searchInput.addEventListener('input', renderList);
        levelCheckboxes.forEach(function (checkbox) {
          checkbox.addEventListener('change', renderList);
        });
      })();
    </script>
  </body>
</html>
