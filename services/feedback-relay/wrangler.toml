# Cloudflare Workers config for the feedback relay. Deployed independently
# of the Electron app — see electron-builder.yml's `files:` allowlist, which
# never references this directory, so it can never end up in a packaged
# build regardless of this config.
name = "utawakui-feedback-relay"
main = "src/index.js"
compatibility_date = "2026-01-01"
workers_dev = false

# This hostname must not have a pre-existing DNS record. Cloudflare creates
# and certificates the Worker Custom Domain during deploy.
routes = [
  { pattern = "api.utawakui.llazypilot.com", custom_domain = true }
]

# Production rate-limit namespace provisioned in Cloudflare. The Worker fails
# closed while this binding is missing or unavailable.
kv_namespaces = [
  { binding = "RATE_LIMIT_KV", id = "9511a39e34b74370841c6a05a0e06713" }
]

# Public protocol marker, deliberately committed and embedded in the desktop
# app. This is a scanner speed bump, not authentication or a secret.
[vars]
CLIENT_MARKER = "utawakui-desktop-feedback-v1"

# The only runtime secret is set interactively after the first deployment:
#   npx --yes wrangler@4.131.2 secret put DISCORD_WEBHOOK_URL
